syntax = "proto3";

package query;

service QueryProcessorService {
  // Initiates the hybrid search and graph iteration process
  rpc StartProcessing (SearchRequest) returns (stream SearchResponse);
  // Fetches the full source document for one retrieved chunk from object storage
  rpc GetChunkSource (ChunkSourceRequest) returns (ChunkSourceResponse);
  // Stores and indexes a text or Markdown file in an isolated corpus
  rpc UploadCorpusFile (UploadCorpusFileRequest) returns (UploadCorpusFileResponse);
  // Lists indexed files in a corpus
  rpc ListCorpusFiles (ListCorpusFilesRequest) returns (ListCorpusFilesResponse);
  // Returns one uploaded file's full text, for preview
  rpc GetCorpusFile (CorpusFileRequest) returns (GetCorpusFileResponse);
  // Removes one uploaded file from object storage, the graph and the vector index
  rpc DeleteCorpusFile (CorpusFileRequest) returns (DeleteCorpusFileResponse);
  // Entities, relationships and chunk clusters for an upload workspace (corpus map)
  rpc GetCorpusMap (CorpusMapRequest) returns (CorpusMapResponse);
}

message SearchRequest {
  string prompt = 1;
  int32 top_k = 2;
  bool use_graph_refinement = 3;
  string corpus_id = 4; // "wiki" or an isolated upload workspace UUID
  repeated string file_ids = 5; // restrict an upload-corpus search to these files; empty = all
}

message SearchResponse {
  oneof response_type {
    ProcessingStatus status = 1;
    StreamChunk chunk = 2;
    FinalAnswer answer = 3;
    AgentStep agent_step = 4;
  }
}

// Emitted once per LangGraph node transition (planner/retriever/analyst/synthesizer)
// so the UI can show which agent is acting and why, instead of only coarse status stages.
message AgentStep {
  string agent = 1;   // "planner" | "retriever" | "analyst" | "synthesizer"
  string detail = 2;  // human-readable summary of what the agent just did/decided
}

message ProcessingStatus {
  string stage = 1; // e.g., "RETRIEVING", "ITERATING", "SYNTHESIZING"
  string message = 2;
}

message StreamChunk {
  string content = 1;
  string source_id = 2;
}

message FinalAnswer {
  string text = 1;
  repeated string sources = 2;
  float confidence_score = 3;
  repeated ChunkInfo chunks = 4; // Ranked evidence chunks (highest hybrid_score first)
}

// One retrieved-and-ranked chunk, surfaced to the UI as "Evidence".
message ChunkInfo {
  string chunk_id = 1;
  string content = 2;        // chunk text snippet
  string source = 3;         // raw object-storage URI, e.g. s3://rag-datasets/file.txt
  float milvus_score = 4;    // semantic similarity (normalized 0-1)
  float pagerank_score = 5;  // graph authority (normalized 0-1)
  float hybrid_score = 6;    // 0.6 * milvus_score + 0.4 * pagerank_score
}

message ChunkSourceRequest {
  string source = 1; // raw object-storage URI, e.g. s3://rag-datasets/file.txt
}

message ChunkSourceResponse {
  bool found = 1;
  string content = 2;
  string error = 3;
}

message UploadCorpusFileRequest {
  string corpus_id = 1;
  string filename = 2;
  bytes content = 3;
}

message UploadCorpusFileResponse {
  bool success = 1;
  string file_id = 2;
  string filename = 3;
  int32 chunk_count = 4;
  string message = 5;
}

message ListCorpusFilesRequest {
  string corpus_id = 1;
}

message CorpusFile {
  string file_id = 1;
  string filename = 2;
}

message ListCorpusFilesResponse {
  repeated CorpusFile files = 1;
}

message CorpusFileRequest {
  string corpus_id = 1;
  string file_id = 2;
}

message GetCorpusFileResponse {
  bool found = 1;
  string filename = 2;
  string content = 3;
  string error = 4;
}

message DeleteCorpusFileResponse {
  bool success = 1;
  string message = 2;
}

message CorpusMapRequest {
  string corpus_id = 1;
  repeated string file_ids = 2; // map only these files; empty = every file in the workspace
}

message CorpusMapResponse {
  bool success = 1;
  string map_json = 2; // entities, relationships, clusters (shape documented in corpus_map.py)
  string error = 3;
}
