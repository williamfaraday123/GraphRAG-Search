syntax = "proto3";

package query;

service QueryProcessorService {
  // Initiates the hybrid search and graph iteration process
  rpc StartProcessing (SearchRequest) returns (stream SearchResponse);
  // Fetches the full source document for one retrieved chunk from object storage
  rpc GetChunkSource (ChunkSourceRequest) returns (ChunkSourceResponse);
}

message SearchRequest {
  string prompt = 1;
  int32 top_k = 2;
  bool use_graph_refinement = 3;
}

message SearchResponse {
  oneof response_type {
    ProcessingStatus status = 1;
    StreamChunk chunk = 2;
    FinalAnswer answer = 3;
    AgentStep agent_step = 4;
  }
}

// Emitted once per LangGraph node transition (planner/retriever/analyst/synthesizer)
// so the UI can show which agent is acting and why, instead of only coarse status stages.
message AgentStep {
  string agent = 1;   // "planner" | "retriever" | "analyst" | "synthesizer"
  string detail = 2;  // human-readable summary of what the agent just did/decided
}

message ProcessingStatus {
  string stage = 1; // e.g., "RETRIEVING", "ITERATING", "SYNTHESIZING"
  string message = 2;
}

message StreamChunk {
  string content = 1;
  string source_id = 2;
}

message FinalAnswer {
  string text = 1;
  repeated string sources = 2;
  float confidence_score = 3;
  repeated ChunkInfo chunks = 4; // Ranked evidence chunks (highest hybrid_score first)
}

// One retrieved-and-ranked chunk, surfaced to the UI as "Evidence".
message ChunkInfo {
  string chunk_id = 1;
  string content = 2;        // chunk text snippet
  string source = 3;         // raw object-storage URI, e.g. s3://rag-datasets/file.txt
  float milvus_score = 4;    // semantic similarity (normalized 0-1)
  float pagerank_score = 5;  // graph authority (normalized 0-1)
  float hybrid_score = 6;    // 0.6 * milvus_score + 0.4 * pagerank_score
}

message ChunkSourceRequest {
  string source = 1; // raw object-storage URI, e.g. s3://rag-datasets/file.txt
}

message ChunkSourceResponse {
  bool found = 1;
  string content = 2;
  string error = 3;
}