# ============================================
# GraphRAG-Search: build the wiki snapshot
#
# A separate project with its own empty databases (no host ports, so it runs alongside the
# main stack), so the snapshot holds the wiki and nothing else. Uses the Ollama on this
# machine for knowledge-graph extraction (KG_MODEL in .env).
#
#   1. Build (hours; resumable, rerun the same command to continue):
#        docker compose -f docker-compose.wiki-build.yml up -d --build
#        docker compose -f docker-compose.wiki-build.yml logs -f wiki-build
#   2. Export vectors and article texts to ingestion_pipeline/snapshot/:
#        docker compose -f docker-compose.wiki-build.yml run --rm wiki-export
#   3. Dump the graph (Neo4j must be stopped):
#        docker compose -f docker-compose.wiki-build.yml stop neo4j
#        docker compose -f docker-compose.wiki-build.yml run --rm neo4j-dump
#   4. Build and push the snapshot images: see "Build the wiki snapshot" in the README.
# ============================================

name: graphrag-wiki-build

services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.20
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000

  minio:
    image: pgsty/minio:latest
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  milvus-standalone:
    image: milvusdb/milvus:v2.5.9
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Same version as the main stack: a dump only loads into its own Neo4j version or a later one
  neo4j:
    image: neo4j:5.26
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password123}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Indexes the articles, then extracts their knowledge graph (query_processor/app/build_wiki.py)
  wiki-build:
    image: ${DOCKERHUB_USER:-graphrag}/graphrag-query-processor:${TAG:-latest}
    build:
      context: ./query_processor
      dockerfile: Dockerfile.render
    command: ["python", "build_wiki.py"]
    env_file:
      - .env
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - MINIO_ENDPOINT=http://minio:9000
      - EDGE_MODEL_BASE_URL=${DOCKER_EDGE_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      - WIKI_DIR=/raw_data
      - WIKI_FILES=${WIKI_FILES:-wiki.test.txt}
      - WIKI_MAX_ARTICLES=${WIKI_MAX_ARTICLES:-0}
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_DISABLE_XET=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ingestion_pipeline/raw_data:/raw_data:ro
      - hf_cache:/app/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Step 2: Milvus vectors and MinIO texts -> ingestion_pipeline/snapshot/
  wiki-export:
    profiles: ["export"]
    build:
      context: ./ingestion_pipeline
      target: tool
    command: ["export", "/snapshot"]
    environment:
      - MILVUS_HOST=milvus-standalone
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-rag-datasets}
    volumes:
      - ./ingestion_pipeline/snapshot:/snapshot

  # Step 3: neo4j-admin database dump (stop the neo4j service first)
  neo4j-dump:
    profiles: ["export"]
    image: neo4j:5.26
    entrypoint: ["neo4j-admin", "database", "dump", "neo4j", "--to-path=/snapshot", "--overwrite-destination=true"]
    volumes:
      - neo4j_data:/data
      - ./ingestion_pipeline/snapshot:/snapshot

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  hf_cache:
