spring.application.name=orchestration_layer
server.port=8080

# gRPC client — connects to the Python Query Processor
grpc.client.host=localhost
grpc.client.port=50051

# CORS — allow the same origin (React served by Spring Boot)
spring.web.cors.allowed-origins=*
spring.web.resources.static-locations=classpath:/static/

# Production — serve React build from static/
spring.web.resources.add-mappings=true
