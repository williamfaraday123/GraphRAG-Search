spring.application.name=orchestration_layer
server.port=8080

# gRPC client — connects to the Python Query Processor
grpc.client.host=localhost
grpc.client.port=50051

# CORS — allow the same origin (React served by Spring Boot)
spring.web.cors.allowed-origins=*
spring.web.resources.static-locations=classpath:/static/

# Production — serve React build from static/
spring.web.resources.add-mappings=true

# Force revalidation on every request instead of trusting browser heuristic
# caching — otherwise a redeploy's new JS/HTML can go unnoticed by browsers
# that already visited (exactly what happened debugging the Evidence/Agent
# Trace sections not appearing after a rebuild).
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# How long a search stream stays open before the UI is told it timed out.
# CPU-only LLMs can need several minutes per answer. Override with SEARCH_SSE_TIMEOUT_MS.
search.sse-timeout-ms=900000

# Include ResponseStatusException reasons (e.g. "File not found") in error JSON so the UI can show them
server.error.include-message=always

# Upload endpoint limits: up to five files, each no larger than 5 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
