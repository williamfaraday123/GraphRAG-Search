services:
  # ============================================
  # Infrastructure Layer
  # ============================================

  # 1. Milvus Standalone (Vector DB)
  milvus-standalone:
    image: milvusdb/milvus:v2.5.9
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ai-net

  # 2. Neo4j (Graph DB)
  neo4j:
    image: neo4j:5
    container_name: neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
      - dbms.security.procedures.unrestricted=*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-password123}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - ai-net

  # 3. MinIO (S3 Compatible Storage)
  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    command: server /minio_data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ai-net

  # 4. Etcd (Milvus metadata store)
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.20
    container_name: etcd
    command:
      - /usr/local/bin/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    restart: unless-stopped
    networks:
      - ai-net

  # ============================================
  # Application Layer
  # ============================================

  # 5. Ingestion Pipeline (one-shot job)
  ingestion_pipeline:
    build:
      context: ./ingestion_pipeline
      dockerfile: Dockerfile
    container_name: ai-ingestion
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - NEO4J_URI=bolt://neo4j:7687
      - MILVUS_HOST=milvus-standalone
    volumes:
      - ./ingestion_pipeline/raw_data:/app/raw_data
    depends_on:
      milvus-standalone:
        condition: service_started
      neo4j:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - ai-net

  # 6. Query Processor (gRPC API)
  query_processor:
    build:
      context: ./query_processor
      dockerfile: Dockerfile
    container_name: ai-query-api
    env_file:
      - .env
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - MINIO_ENDPOINT=http://minio:9000
    ports:
      - "50051:50051"
    depends_on:
      milvus-standalone:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped
    networks:
      ai-net:
        aliases:
          - query-processor

  # 7. Orchestration Layer (Spring Boot REST API)
  orchestration_layer:
    build:
      context: ./orchestration_layer
      dockerfile: Dockerfile
    container_name: ai-orchestration
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - GRPC_CLIENT_HOST=query-processor
      - GRPC_CLIENT_PORT=50051
    depends_on:
      query_processor:
        condition: service_started
    restart: unless-stopped
    networks:
      - ai-net

# ============================================
# Volumes
# ============================================
volumes:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  etcd_data:

# ============================================
# Network
# ============================================
networks:
  ai-net:
    driver: bridge
